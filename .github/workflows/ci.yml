name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      # Plain `uv sync` installs the default `dev` dependency group, so ruff
      # and pytest land in the venv without any extra flags.
      - name: Install dependencies
        run: uv sync --python 3.11

      # The integration test (tests/test_kb_roundtrip.py) builds a real ChromaDB,
      # which downloads the ~80MB all-MiniLM-L6-v2 ONNX model on first use. Cache
      # ChromaDB's model dir (and the HF cache as a fallback) so it's fetched once
      # and restored on later runs instead of re-downloaded on every CI run.
      - name: Cache embedding model
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/chroma
            ~/.cache/huggingface
          key: embedding-model-all-MiniLM-L6-v2-v1

      - name: Lint
        run: uv run ruff check .

      # The consumer half of the SYS-004 guard, and the only check in this repo
      # that looks OUTWARD. Every other test asserts this code against fixtures
      # this repo controls, which is why the provider adding `region` went
      # undetected here for a full day while CI stayed green. Fetches the
      # provider's published contract and fails on divergence. A fetch failure
      # (GitHub outage) warns and passes; a successful fetch showing drift fails.
      - name: Contract matches the provider (SYS-004)
        run: uv run python scripts/check_classify_contract.py

      # The same guard for the second seam this repo consumes: notes-api's
      # GET /notes (SYS-006). That contract is OPEN — an added provider field is
      # backward-compatible — so this fails only when a field search_notes
      # actually reads disappears, which otherwise degrades silently to None.
      - name: Notes read contract matches the provider (SYS-006)
        run: uv run python scripts/check_notes_contract.py

      # The architecture repo has enforced 'Downstream surfaces' on SYS-NNN docs
      # since 2026-07-18; repo-local ADR tiers had no check at all. That gap is how
      # a classifier ADR shipped without one and the follow-up sweep missed a file.
      # All 7 ADRs here already comply, so this is enforced with zero exceptions.
      - name: ADRs list their downstream surfaces
        run: uv run python scripts/lint_decisions.py

      - name: Test
        run: uv run pytest

      # ---- Retrieval eval (system/SYS-017 tier 1) --------------------------
      # The eval RUNS and REPORTS on every push and pull request. It does NOT gate
      # the merge, and there is deliberately no floors file: SYS-017's rollout
      # found no existing retrieval number floor-eligible, because every published
      # figure (including both arms of kb-agent/ADR-010's A/B) was measured on the
      # author's workstation against a corpus CI could not reconstruct. The
      # eligible runs are the ones these steps produce — plural, since a floor
      # needs a run-to-run noise band under it. Tier 2 is a later, separate job.
      #
      # Tier 1's entry condition is corpus provenance: CI must rebuild every input
      # from version control. 12 of the gold set's 27 queries expect sources under
      # learning-notes/, a separate public repo, so it is cloned here and the index
      # is pointed at the clone (kb-agent/ADR-012). Nothing paid or non-deterministic
      # runs on this leg — retrieval embeds locally with all-MiniLM-L6-v2, which the
      # cache above already covers. scripts/eval_kind_usage.py spends API budget and
      # is deliberately absent; it stays owner-triggered.
      #
      # The clone's DIRECTORY NAME is load-bearing: index.py records a note's source
      # as "<dirname>/<file>.md" and the gold set spells them "learning-notes/...",
      # so cloning to any other name scores all 12 as misses.
      - name: Clone the notes corpus (learning-notes)
        run: |
          git clone --depth 1 https://github.com/sanlee-ys/learning-notes.git \
            "${{ runner.temp }}/learning-notes"

      # A configured-but-absent notes dir is a hard error in index.py, so this step
      # fails loudly if the clone did not land rather than building a short index
      # that the eval below would report as bad retrieval.
      - name: Build the index
        env:
          KB_AGENT_NOTES_DIRS: ${{ runner.temp }}/learning-notes
        run: uv run python scripts/index.py

      # Both arms. The unfiltered arm is the headline number; the --kind-filter arm
      # exercises search_kb's metadata `where` path, which the unfiltered arm cannot
      # see break. Neither asserts a threshold — a non-zero exit here means the
      # harness itself failed (unindexed KB, non-success observation), not that
      # retrieval got worse.
      - name: Retrieval eval — unfiltered (report only)
        run: uv run python scripts/eval_retrieval.py

      - name: Retrieval eval — kind filter (report only)
        run: uv run python scripts/eval_retrieval.py --kind-filter
