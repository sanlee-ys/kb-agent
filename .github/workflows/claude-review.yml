name: claude-review

# Agentic PR review via anthropics/claude-code-action. Rationale in
# decisions/ADR-008-claude-code-action-pr-review.md; the cross-repo standard this
# instantiates is SYS-021 (an agentic CI job proves itself by its artifact, never by its
# exit code), and defense-news-classifier/decisions/016 is the first instance.
#
# ADVISORY lane, not a gate: it posts review comments and never fails the build. ci.yml
# holds the gates (ruff, the SYS-004/SYS-006 contract guards, the ADR lint, pytest); a
# model's opinion is not one, and a red X from a non-deterministic reviewer would train
# the habit of ignoring red Xs.
#
# `opened` only, deliberately NOT `synchronize`: re-reviewing on every push is both a
# per-push API charge and a stream of near-duplicate comments on unfinished work.
# Re-review on demand with @claude, via the issue_comment trigger below.
#
# Deliberately does NOT use pull_request_target -- that trigger runs untrusted fork code
# in the base repo's context WITH secrets.
on:
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]
  # Inline review comments on a PR. issue_comment covers only the top-level conversation
  # tab, so "@claude why is this line like this" on a specific line fired an event nothing
  # was listening for.
  #
  # NOT covered, deliberately: commit_comment. @claude on a commit page is a natural thing
  # to do and does nothing, but the action does not support that event -- its supported set
  # is issue_comment, pull_request_review_comment, issues and pull_request_review. Wiring
  # it would start a run that then fails on context it cannot build, which is worse than
  # not firing. Comment on a PR (open OR merged), not on a commit.
  pull_request_review_comment:
    types: [created]

# id-token: write is required, not optional (SYS-021 req. 1's sibling finding): the action
# exchanges a GitHub OIDC token for its App token and fails at setupGitHubToken without it,
# before ever reaching the model. It mints an identity token for this repo; it is not write
# access to contents, which stays read -- this lane comments, it never pushes.
permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

jobs:
  review:
    # SYS-021 req. 4 -- the trigger surface, whose platform defaults are asymmetric.
    #
    # pull_request from a fork FAILS CLOSED: GitHub withholds secrets, so the run would
    # die on auth rather than on the code. Skipping keeps a contributor's first PR from
    # greeting them with a red X they cannot fix and did not cause.
    #
    # Both comment events FAIL OPEN: they run in the base repo's context WITH secrets no
    # matter who commented. On a public repo an unguarded @claude is an open spend vector
    # on the owner's API key. OWNER-only on both, evaluated before a runner is allocated.
    #
    # Bot actors are the third case, added 2026-07-25. The action refuses
    # bot-authored PRs outright ("Workflow initiated by non-human actor:
    # dependabot (type: Bot)") and exits 1, so before this guard every bump
    # allocated a runner, authenticated, and failed -- a red X on a PR nobody
    # meant to review. ADR-008 accepts that bumps go unreviewed; this turns that
    # acceptance into a clean skip, the way the fork case above turns withheld
    # secrets into one. `user.type` rather than the dependabot login, to cover
    # every bot the action refuses for the same reason.
    #
    # Only on the pull_request path: an OWNER commenting @claude on a bump is a
    # human explicitly asking, and that escape hatch keeps working.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.type != 'Bot') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       github.event.comment.author_association == 'OWNER') ||
      (github.event_name == 'pull_request_review_comment' &&
       github.event.comment.author_association == 'OWNER')
    runs-on: ubuntu-latest
    # Keyed on PR number, NOT github.ref: on issue_comment events github.ref is the default
    # branch, so a ref-keyed group would collapse every @claude across every PR into one
    # group and let them cancel each other.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    # Backstop only -- greens the RUN, not the CHECK. The step-level
    # continue-on-error below is what actually satisfies SYS-021 req. 3. Kept for
    # a failure with no step to attach to (runner death, a failing checkout).
    #
    # This placement alone was recorded as satisfying req. 3 and did not: measured
    # on defense-news-classifier PR #123 (run 30141009937) the run concluded
    # `success` while the check run concluded `failure`, so the red X still
    # reached the PR. SYS-021 Amendment 1 corrects the requirement.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      # THE placement that enforces advisory status. `jobs.<id>.continue-on-error`
      # keeps a failing job from failing the RUN; `steps[*].continue-on-error`
      # keeps a failing step from failing the JOB -- and the job's conclusion is
      # what GitHub publishes as the check run the PR shows.
      - uses: anthropics/claude-code-action@v1
        continue-on-error: true
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this pull request for correctness, security, and adherence to the
            conventions in CLAUDE.md.

            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            Start by reading the diff (`gh pr diff`). Work out which files it actually
            touches, then check ONLY the invariants below that this diff could plausibly
            break -- open a file when the diff gives you a reason to, not to complete a
            checklist. A doc-only change needs almost none of them. Say briefly which ones
            you judged relevant and move on; do not narrate the ones you skipped.

            This repo is a RAG + tool-use agent over a local knowledge base. The invariants
            that break quietly:

              - SYS-003 observation contract. Every tool result in agent/tools.py must be
                built via _success/_problem and carry status + payload/source or
                next_actions. A new tool that returns a bare string or dict breaks the
                contract the agent's prompt branches on.
              - The tool layer has ONE home. agent/tools.py owns the tool functions and
                their descriptions; mcp_server/server.py must consume them, never
                reimplement a tool or retype a description. A fork there drifts silently
                because both transports still work.
              - Model pins (SYS-002: exact IDs, no date suffixes). DEFAULT_MODEL in
                agent/agent.py and MODEL in scripts/ingest.py are separate constants that
                must move together -- flag a PR that changes one and not the other.
              - The cross-repo contract guards (scripts/check_classify_contract.py for
                SYS-004, scripts/check_notes_contract.py for SYS-006) are the only checks
                here that look outward. Flag changes that weaken or skip them.
              - kb/projects/kb-agent.md is hand-written and sits outside ingest.py's
                pipeline, so nothing regenerates it. If this PR materially changes
                mcp_server/server.py or the tool layer, that stub likely needs a manual
                update or it drifts from the code it describes.
              - chroma_db/ is generated and git-ignored -- it must never appear in a diff.
              - New ADRs must have a "## Downstream surfaces" section (enforced by
                scripts/lint_decisions.py with zero exceptions).

            Be specific and actionable. If the change is clean, say so briefly rather
            than manufacturing findings -- a review that always finds something trains
            the reader to skip it.

            Post the review with `gh pr comment` for top-level findings, and
            mcp__github_inline_comment__create_inline_comment (with confirmed: true)
            for anything tied to a specific line. Reviewing without posting is a
            no-op -- the comment IS the deliverable.
          # --model pinned per SYS-002. --max-turns bounds the agentic loop.
          #
          # --allowedTools is SYS-021 req. 1. Per the action's docs it EXTENDS the default
          # tool set rather than replacing it ("the base GitHub tools are always included").
          #
          # Measured here, without a clean A/B -- both runs also differed in prompt and
          # diff, so read this as evidence, not mechanism:
          #   without Read/Grep/Glob: 12 denials, 16 turns, $0.50, nothing posted
          #   with them:               9 denials, 21 turns, $0.59, review posted
          #
          # Naming them explicitly is cheap and demonstrably did not hurt, so they stay.
          # The residual denials are NOT identified -- the action reports only a count,
          # never the refused tool names -- so the loop length was attacked from the prompt
          # side (scope the checks to the diff) rather than by widening permissions
          # blindly. Omitting the comment tools entirely remains the silent killer: on the
          # classifier that was a green 36s run that spent $0.14 and posted nothing.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 20
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          use_sticky_comment: true
          classify_inline_comments: true
